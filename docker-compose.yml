services:
  db:
    image: ankane/pgvector:latest
    container_name: tars_db
    environment:
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: tars_pass
      POSTGRES_DB: tars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
